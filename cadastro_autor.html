<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Autores — Sistema Literário</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📚</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

    <div class="page-header-bar">
        <h2>✍️ Gerenciar Autores</h2>
        <div class="header-actions">
            <a href="index.html" class="btn-back">← Menu</a>
        </div>
    </div>

    <!-- Formulário em grade: dados fixos (Fase 1), sem envio real -->
    <form action="#" method="get" enctype="multipart/form-data">
        <div class="form-grid">
            <div class="form-group">
                <label for="nome">Nome do autor</label>
                <input type="text" id="nome" name="nome" placeholder="Ex.: Machado de Assis" required>
            </div>
            <div class="form-group">
                <label for="genero">Gênero literário</label>
                <input type="text" id="genero" name="genero" placeholder="Ex.: Romance" required>
            </div>
            <div class="form-group">
                <label for="pais">País</label>
                <input type="text" id="pais" name="pais" placeholder="Ex.: Brasil" required>
            </div>
            <div class="form-group">
                <label for="foto">Foto do autor</label>
                <input type="file" id="foto" name="foto" accept="image/*">
                <small>JPG ou PNG</small>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-primary">💾 Salvar autor</button>
            </div>
        </div>
    </form>

    <h3>Autores cadastrados</h3>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-foto">Foto</th>
                    <th>Nome</th>
                    <th>Gênero</th>
                    <th>País</th>
                    <th class="col-acoes">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-foto"><div class="no-image">Sem foto</div></td>
                    <td>Machado de Assis</td>
                    <td>Romance</td>
                    <td>Brasil</td>
                    <td class="col-acoes">
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">🗑️ Excluir</a>
                            <a href="cadastro_livro.html" class="btn-music">📖 Livros</a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="col-foto"><div class="no-image">Sem foto</div></td>
                    <td>J.R.R. Tolkien</td>
                    <td>Fantasia</td>
                    <td>Reino Unido</td>
                    <td class="col-acoes">
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">🗑️ Excluir</a>
                            <a href="cadastro_livro.html" class="btn-music">📖 Livros</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
