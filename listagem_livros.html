<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Livros — Sistema Literário</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>📚</text></svg>">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">

    <div class="page-header-bar">
        <h2>📚 Biblioteca de Livros</h2>
        <div class="header-actions">
            <a href="cadastro_livro.html" class="btn-primary">➕ Novo livro</a>
            <a href="index.html" class="btn-back">← Menu</a>
        </div>
    </div>

    <!-- Filtros combináveis: busca geral, autor e gênero -->
    <form action="#" method="get" class="filters">
        <div class="filter-group">
            <div class="filter-item">
                <label for="busca">Busca geral</label>
                <input type="text" id="busca" name="busca" placeholder="Título, autor ou editora...">
            </div>
            <div class="filter-item">
                <label for="autor">Autor</label>
                <select id="autor" name="autor">
                    <option value="">Todos os autores</option>
                    <option value="1">Machado de Assis</option>
                    <option value="2">J.R.R. Tolkien</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="genero">Gênero</label>
                <select id="genero" name="genero">
                    <option value="">Todos os gêneros</option>
                    <option value="Romance">Romance</option>
                    <option value="Fantasia">Fantasia</option>
                    <option value="Ficção científica">Ficção científica</option>
                    <option value="Terror">Terror</option>
                    <option value="Biografia">Biografia</option>
                </select>
            </div>
        </div>
        <div class="filter-actions">
            <button type="submit" class="btn-primary">🔍 Filtrar</button>
            <a href="listagem_livros.html" class="btn-back">Limpar</a>
        </div>
    </form>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-capa">Capa</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Editora</th>
                    <th>Gênero</th>
                    <th class="col-previa">Prévia</th>
                    <th class="col-acoes">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="col-capa"><div class="no-image">Sem capa</div></td>
                    <td>Dom Casmurro</td>
                    <td>Machado de Assis</td>
                    <td>Companhia das Letras</td>
                    <td>Romance</td>
                    <td class="col-previa"><a href="https://books.google.com.br" target="_blank" class="btn-previa">📖 Ler prévia</a></td>
                    <td class="col-acoes">
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">🗑️ Excluir</a>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td class="col-capa"><div class="no-image">Sem capa</div></td>
                    <td>O Hobbit</td>
                    <td>J.R.R. Tolkien</td>
                    <td>HarperCollins</td>
                    <td>Fantasia</td>
                    <td class="col-previa"><a href="https://books.google.com.br" target="_blank" class="btn-previa">📖 Ler prévia</a></td>
                    <td class="col-acoes">
                        <div class="action-buttons">
                            <a href="#" class="btn-edit">✏️ Editar</a>
                            <a href="#" class="btn-delete">🗑️ Excluir</a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
